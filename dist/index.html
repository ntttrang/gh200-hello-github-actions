<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello GitHub Actions</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        border-radius: 16px;
        padding: 2rem 3rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        text-align: center;
      }
      h1 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello, GitHub Actions!</h1>
      <p>This static site is deployed via GitHub Pages.</p>
    </main>
  </body>
</html>
