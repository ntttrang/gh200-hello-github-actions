name: Break Matrix

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run with Node ${{ matrix.node }}
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          echo "Running on Node version: $NODE_VERSION"
          if [ "$NODE_VERSION" = "20" ]; then
            echo "Failing deliberately for Node 20"
            exit 1
          else
            echo "Success for Node 22"
          fi
