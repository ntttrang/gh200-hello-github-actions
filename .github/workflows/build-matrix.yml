name: Build matrix

on:
    workflow_dispatch:
        inputs:
            environments:
                description: 'Choose environments'
                default: staging
                required: false
                type: choice
                options:
                    - staging
                    - production
            dry-run:
                description: 'Run in dry-run mode'
                type: boolean
                default: false

jobs:
    build:
        name: Build
        strategy:
            matrix:
                version: [20,22]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup node
              uses: actions/setup-node@v4
              with:
                node-version: ${{matrix.version}}

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test --if-present

            -   name: Upload artifact
                uses: actions/upload-artifact@v4
                with:
                    name: node-app-${{ matrix.version }}
                    path: .
                    retention-days: 7
    
    report:
        name: Report
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Download
              uses:   actions/download-artifact@v4

            - name: List downloaded files
              run: |
                ls -R


        