name: Build matrix

on:
    workflow_dispatch:
        inputs:
            environments:
                description: 'Choose environments'
                default: staging
                required: false
                type: choice
                options:
                    - staging
                    - production
            dry-run:
                type: boolean
                default: false

jobs:
    build:
        name: Build
        strategy:
            matrix:
                version: [20,22]
        runs-on: ubuntu-latest
        steps:
            - name: Setup node
              uses: actions/setup-node@v4
              with:
                node-version: ${{matrix.version}}

            -   name: Upload artifact
                uses: actions/upload-artifact@v4
                with:
                    name: my-artifact
                    path: my_text.txt
                    retention-days: 7
    
    report:
        name: Report
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Download
              uses:   actions/download-artifact@v4
              with:
                name: my-artifact


        