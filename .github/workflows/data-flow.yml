name: Data Flow
on:
    workflow_dispatch:

jobs:
    setup:
        runs-on: ubuntu-latest
        outputs:
            version: ${{steps.meta.outputs.version}}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Compute version and environment variables
              id: meta
              run: |
                versio$(git describe --tags 2>/dev/null || echo 0.0.0)
                echo "version=$version" >> "$GITHUB_OUTPUT"
                echo "built_at=$(date -u)" >> "$GITHUB_ENV"
    
    consume:
        needs: setup
        runs-on: ubuntu-latest
        steps:
            - name: Consume upstream data
              run: |
                echo "Version from setup: ${{needs.setup.outputs.version}}"
                echo "Built at timestamp: $built_at"
                echo "### Build Report" >> "$GITHUB_STEP_SUMMARY"
                echo "- **Version:** ${{needs.setup.outputs.version}}" >> "$GITHUB_STEP_SUMMARY"
                echo "- **Built At:** $built_at" >> "$GITHUB_STEP_SUMMARY"